<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FABCAST · Setup CNC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--nav:#111827;--blue:#2457d6;--bg:#f4f6f9;--card:#fff;--line:#dce2ea;--text:#172033;--muted:#687386;--green:#16794f;--red:#b42318;--shadow:0 10px 30px rgba(17,24,39,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#111827,#20345a)}
    .login-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 30px 70px rgba(0,0,0,.25)}
    .brand{font-size:28px;font-weight:900;letter-spacing:.04em;margin-bottom:4px}.subtitle{color:var(--muted);margin-bottom:22px}
    .field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}.field input:focus{border-color:#8cabff;box-shadow:0 0 0 3px rgba(36,87,214,.10)}
    .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.btn-primary{background:var(--blue);color:#fff}.btn-secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.login-card .btn{width:100%}
    .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--muted)}.msg.error{color:var(--red)}.msg.ok{color:var(--green)}
    .app-shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}aside{background:var(--nav);color:#fff;padding:22px 18px;display:flex;flex-direction:column}.side-brand{font-weight:900;font-size:22px;margin-bottom:28px}.nav-item{padding:11px 12px;border-radius:10px;color:#d3dae5;background:#263857;font-weight:700}.version{margin-top:auto;color:#99a5b8;font-size:12px}
    .nav-button{width:100%;text-align:left;border:0;margin:0 0 7px 0;cursor:pointer}
    .nav-button.active{background:#2f4770;color:#fff}
    .parts-head{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px 12px;font-size:12px;font-weight:900;color:var(--muted);border-bottom:1px solid var(--line)}
    .part-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
    .part-row:last-child{border-bottom:0}
    .part-code{font-weight:900;color:var(--blue)}
    .source-note{font-size:13px;color:var(--muted);margin-top:4px}

    main{min-width:0}.topbar{min-height:70px;background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:12px;align-items:center}.topbar .title{font-weight:900;font-size:20px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.user-email{color:var(--muted);font-size:13px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .page{padding:24px;max-width:1200px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar h1{margin:0;font-size:24px}.search{margin-bottom:16px}.search input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.statusbar{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);color:var(--muted);font-size:13px;margin-bottom:14px}
    .setup-list{display:grid;gap:10px}.setup-item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.setup-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.setup-code{font-weight:900;font-size:16px}.badge{font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;background:#eaf7f1;color:var(--green)}.setup-name{font-weight:700;margin-top:6px}.setup-meta{color:var(--muted);font-size:13px;margin-top:5px}.empty{text-align:center;color:var(--muted);padding:40px 10px}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.50);display:grid;place-items:center;z-index:100;padding:20px}.modal-card{width:min(720px,100%);background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.25);padding:20px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
    @media(max-width:800px){.app-shell{display:block}aside{display:none}.page{padding:14px}.form-grid{grid-template-columns:1fr}.topbar{padding:12px 14px}.user-email{display:none}}
  </style>
</head>
<body>
  <section id="loginView" class="login-screen">
    <form class="login-card" onsubmit="login(event)">
      <div class="brand">FABCAST</div>
      <div class="subtitle">Setup CNC · V1.0 limpa</div>
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="btn btn-primary" type="submit">Entrar</button>
      <div id="loginMsg" class="msg"></div>
    </form>
  </section>

  <section id="appView" class="app-shell hidden">
    <aside>
      <div class="side-brand">FABCAST</div>
      <button id="navSetups" class="nav-item nav-button active" type="button" onclick="showView('setups')">⚙ Setups CNC</button>
      <button id="navParts" class="nav-item nav-button" type="button" onclick="showView('parts')">▣ Peças</button>
      <div class="version">V1.2 · PEÇAS</div>
    </aside>
    <main>
      <header class="topbar">
        <div id="topPageTitle" class="title">Setup CNC</div>
        <div class="top-actions"><div id="userEmail" class="user-email"></div><button class="btn btn-secondary" type="button" onclick="logout()">Sair</button></div>
      </header>
      <div id="setupsView" class="page">
        <div class="card">
          <div class="toolbar"><h1>Setups</h1><button class="btn btn-primary" type="button" onclick="openNewSetup()">+ Novo setup</button></div>
          <div class="search"><input id="searchInput" placeholder="Pesquisar por código, designação, cliente, máquina ou programa..." oninput="renderSetups()"></div>
          <div id="statusBar" class="statusbar">A iniciar...</div>
          <div id="setupList" class="setup-list"></div>
        </div>
      </div>

      <div id="partsView" class="page hidden">
        <div class="card">
          <div class="toolbar">
            <div>
              <h1>Peças</h1>
              <div class="source-note">Código e designação provenientes do Planeamento – Maquinação.</div>
            </div>
          </div>
          <div class="search"><input id="partsSearchInput" placeholder="Pesquisar código ou nome da peça..." oninput="renderPlanningParts()"></div>
          <div id="partsStatusBar" class="statusbar">A carregar peças...</div>
          <div id="partsCount" class="source-note" style="margin-bottom:10px"></div>
          <div class="card" style="padding:0;box-shadow:none">
            <div class="parts-head"><div>Código</div><div>Designação / nome da peça</div></div>
            <div id="partsList"></div>
          </div>
        </div>
      </div>
    </main>
  </section>

  <section id="newSetupModal" class="modal hidden" onclick="backdropClose(event)">
    <form class="modal-card" onsubmit="createSetup(event)">
      <div class="modal-head"><h2>Novo setup</h2><button class="btn btn-secondary" type="button" onclick="closeNewSetup()">Fechar</button></div>
      <div class="form-grid">
        <div class="field"><label for="mCode">Código interno peça</label><input id="mCode" maxlength="8" inputmode="numeric" list="partsCodeList" placeholder="Opcional" oninput="syncNewPartFromCode()"></div>
        <div class="field"><label for="mDesignation">Designação *</label><input id="mDesignation" required></div>
        <div class="field"><label for="mClient">Cliente</label><input id="mClient"></div>
        <div class="field"><label for="mOperation">Operação *</label><input id="mOperation" placeholder="Ex.: OP10" required></div>
        <div class="field"><label for="mMachine">Máquina *</label><input id="mMachine" placeholder="Ex.: UMC-750-1" required></div>
        <div class="field"><label for="mProgram">Programa CNC</label><input id="mProgram"></div>
      </div>
      <div id="createMsg" class="msg"></div>
      <div class="modal-actions"><button class="btn btn-secondary" type="button" onclick="closeNewSetup()">Cancelar</button><button id="createBtn" class="btn btn-primary" type="submit">Criar setup</button></div>
    </form>
  </section>


  <section id="editSetupModal" class="modal hidden" onclick="editBackdropClose(event)">
    <form class="modal-card" onsubmit="saveSetup(event)">
      <div class="modal-head">
        <h2>Setup</h2>
        <button class="btn btn-secondary" type="button" onclick="closeEditSetup()">Fechar</button>
      </div>

      <input id="eId" type="hidden">

      <div class="form-grid">
        <div class="field">
          <label for="eCode">Código interno peça</label>
          <input id="eCode" maxlength="8" inputmode="numeric" list="partsCodeList" placeholder="Opcional" oninput="syncEditPartFromCode()">
        </div>

        <div class="field">
          <label for="eDesignation">Designação *</label>
          <input id="eDesignation" required>
        </div>

        <div class="field">
          <label for="eClient">Cliente</label>
          <input id="eClient">
        </div>

        <div class="field">
          <label for="eOperation">Operação *</label>
          <input id="eOperation" required>
        </div>

        <div class="field">
          <label for="eMachine">Máquina *</label>
          <input id="eMachine" required>
        </div>

        <div class="field">
          <label for="eProgram">Programa CNC</label>
          <input id="eProgram">
        </div>
      </div>

      <div id="editMsg" class="msg"></div>

      <div class="modal-actions">
        <button class="btn btn-secondary" type="button" onclick="closeEditSetup()">Cancelar</button>
        <button id="saveBtn" class="btn btn-primary" type="submit">Guardar alterações</button>
      </div>
    </form>
  </section>

  <datalist id="partsCodeList"></datalist>

  <script>
    const SUPABASE_URL = "https://sxjvcogannhewhoovdar.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wa3NLkXzs6jbUDkWbPaj3Q_Rt1RTMVx";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const PLANNING_SUPABASE_URL = "https://akblvvmoucnkwzutmwls.supabase.co";
    const PLANNING_SUPABASE_KEY = "sb_publishable_zSpyuREZ6il9a1OdtHVhlQ_oeRoaJs3";
    const planningSb = supabase.createClient(
      PLANNING_SUPABASE_URL,
      PLANNING_SUPABASE_KEY,
      {auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}
    );

    let setups = [];
    let planningParts = [];
    const el = id => document.getElementById(id);

    function setLoginMsg(text, type=""){const box=el("loginMsg");box.textContent=text||"";box.className="msg"+(type?" "+type:"");}
    function setCreateMsg(text, type=""){const box=el("createMsg");box.textContent=text||"";box.className="msg"+(type?" "+type:"");}
    function setEditMsg(text, type=""){const box=el("editMsg");box.textContent=text||"";box.className="msg"+(type?" "+type:"");}
    function setStatus(text, error=false){const box=el("statusBar");box.textContent=text||"";box.style.color=error?"#b42318":"#687386";}
    function showLogin(){el("loginView").classList.remove("hidden");el("appView").classList.add("hidden");}
    function showApp(user){
      el("loginView").classList.add("hidden");
      el("appView").classList.remove("hidden");
      el("userEmail").textContent=user?.email||"";
    }

    async function boot(){
      try{
        const {data,error}=await sb.auth.getSession();
        if(error) throw error;
        if(data?.session?.user){showApp(data.session.user);await Promise.all([loadSetups(),loadPlanningParts()]);}else{showLogin();}
        sb.auth.onAuthStateChange(async(_event,newSession)=>{
          if(newSession?.user){showApp(newSession.user);await Promise.all([loadSetups(),loadPlanningParts()]);}else{showLogin();}
        });
      }catch(err){console.error(err);showLogin();setLoginMsg("Erro ao iniciar: "+(err?.message||err),"error");}
    }

    async function login(event){
      event.preventDefault();
      const btn=el("loginBtn"),email=el("loginEmail").value.trim(),password=el("loginPassword").value;
      setLoginMsg("");btn.disabled=true;btn.textContent="A entrar...";
      try{
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        if(!data?.session?.user) throw new Error("Sessão não criada.");
        showApp(data.session.user);await Promise.all([loadSetups(),loadPlanningParts()]);
      }catch(err){console.error(err);setLoginMsg("Não foi possível entrar: "+(err?.message||err),"error");}
      finally{btn.disabled=false;btn.textContent="Entrar";}
      return false;
    }

    async function logout(){await sb.auth.signOut();setups=[];renderSetups();showLogin();}


    function showView(view){
      const setupsActive=view==="setups";
      el("setupsView").classList.toggle("hidden",!setupsActive);
      el("partsView").classList.toggle("hidden",setupsActive);
      el("navSetups").classList.toggle("active",setupsActive);
      el("navParts").classList.toggle("active",!setupsActive);
      el("topPageTitle") && (el("topPageTitle").textContent=setupsActive?"Setup CNC":"Peças");
      if(!setupsActive) renderPlanningParts();
    }

    async function loadPlanningParts(){
      const status=el("partsStatusBar");
      if(status) status.textContent="A carregar peças do Planeamento – Maquinação...";

      try{
        const {data,error}=await planningSb
          .from("app_state")
          .select("data")
          .eq("id",1)
          .single();

        if(error) throw error;

        const rawParts=Array.isArray(data?.data?.parts)?data.data.parts:[];
        planningParts=rawParts
          .filter(p=>p && (p.code || p.desc))
          .map(p=>({
            id:p.id||"",
            code:String(p.code||"").trim(),
            desc:String(p.desc||"").trim()
          }))
          .sort((a,b)=>a.code.localeCompare(b.code,"pt-PT",{numeric:true}));

        fillPartsDatalist();
        renderPlanningParts();

        if(status){
          status.textContent=planningParts.length
            ? "Ligação ao Planeamento OK."
            : "Ligação ao Planeamento OK, mas não existem peças registadas.";
          status.style.color="#687386";
        }
      }catch(err){
        console.error("Erro ao carregar peças do Planeamento:",err);
        planningParts=[];
        fillPartsDatalist();
        renderPlanningParts();
        if(status){
          status.textContent="Erro ao ler peças do Planeamento: "+(err?.message||err);
          status.style.color="#b42318";
        }
      }
    }

    function fillPartsDatalist(){
      const dl=el("partsCodeList");
      if(!dl) return;
      dl.innerHTML=planningParts.map(p=>`<option value="${escapeHtml(p.code)}">${escapeHtml(p.desc)}</option>`).join("");
    }

    function renderPlanningParts(){
      const root=el("partsList");
      if(!root) return;

      const q=(el("partsSearchInput")?.value||"").trim().toLowerCase();
      const rows=planningParts.filter(p=>
        !q ||
        p.code.toLowerCase().includes(q) ||
        p.desc.toLowerCase().includes(q)
      );

      el("partsCount").textContent=`${rows.length} peça${rows.length===1?"":"s"}`;

      if(!rows.length){
        root.innerHTML='<div class="empty">Nenhuma peça encontrada.</div>';
        return;
      }

      root.innerHTML=rows.map(p=>`
        <div class="part-row">
          <div class="part-code">${escapeHtml(p.code||"—")}</div>
          <div>${escapeHtml(p.desc||"—")}</div>
        </div>
      `).join("");
    }

    function findPlanningPartByCode(code){
      const v=String(code||"").trim();
      return planningParts.find(p=>p.code===v)||null;
    }

    function syncNewPartFromCode(){
      const p=findPlanningPartByCode(el("mCode").value);
      if(p) el("mDesignation").value=p.desc;
    }

    function syncEditPartFromCode(){
      const p=findPlanningPartByCode(el("eCode").value);
      if(p) el("eDesignation").value=p.desc;
    }

    async function loadSetups(){
      setStatus("A carregar setups...");
      try{
        const {data,error}=await sb.from("setups").select("id,codigo_peca,designacao,cliente,operacao,maquina,programa_cnc,estado,updated_at").order("updated_at",{ascending:false});
        if(error) throw error;
        setups=data||[];renderSetups();
        setStatus(setups.length===0?"Ligação ao Supabase OK. Ainda não existem setups.":"Ligação ao Supabase OK · "+setups.length+" setup(s).");
      }catch(err){console.error(err);setups=[];renderSetups();setStatus("Erro ao ler o Supabase: "+(err?.message||err),true);}
    }

    function renderSetups(){
      const list=el("setupList");if(!list)return;
      const q=(el("searchInput")?.value||"").trim().toLowerCase();
      const filtered=setups.filter(s=>![s.codigo_peca,s.designacao,s.cliente,s.operacao,s.maquina,s.programa_cnc].join(" ").toLowerCase().indexOf(q));
      const finalList=q?setups.filter(s=>[s.codigo_peca,s.designacao,s.cliente,s.operacao,s.maquina,s.programa_cnc].join(" ").toLowerCase().includes(q)):setups;
      if(finalList.length===0){list.innerHTML='<div class="empty">Nenhum setup encontrado.</div>';return;}
      list.innerHTML=finalList.map(s=>`<article class="setup-item" role="button" tabindex="0" onclick="openSetup('${s.id}')" onkeydown="if(event.key==='Enter') openSetup('${s.id}')"><div class="setup-head"><div class="setup-code">${escapeHtml(s.codigo_peca||"SEM CÓDIGO")}</div><span class="badge">${escapeHtml(s.estado||"Ativo")}</span></div><div class="setup-name">${escapeHtml(s.designacao||"")}</div><div class="setup-meta">${escapeHtml(s.cliente||"Sem cliente")} · ${escapeHtml(s.operacao||"")} · ${escapeHtml(s.maquina||"")}${s.programa_cnc?" · Prog. "+escapeHtml(s.programa_cnc):""}</div><div class="setup-meta" style="margin-top:8px;font-weight:700;color:#2457d6">Abrir setup</div></article>`).join("");
    }

    function openNewSetup(){clearNewSetup();setCreateMsg("");fillPartsDatalist();el("newSetupModal").classList.remove("hidden");setTimeout(()=>el("mCode").focus(),0);}
    function closeNewSetup(){el("newSetupModal").classList.add("hidden");}
    function backdropClose(event){if(event.target===el("newSetupModal"))closeNewSetup();}
    function clearNewSetup(){["mCode","mDesignation","mClient","mOperation","mMachine","mProgram"].forEach(id=>el(id).value="");}


    function openSetup(id){
      const s=setups.find(x=>x.id===id);
      if(!s) return;
      el("eId").value=s.id;
      el("eCode").value=s.codigo_peca||"";
      el("eDesignation").value=s.designacao||"";
      el("eClient").value=s.cliente||"";
      el("eOperation").value=s.operacao||"";
      el("eMachine").value=s.maquina||"";
      el("eProgram").value=s.programa_cnc||"";
      setEditMsg("");
      el("editSetupModal").classList.remove("hidden");
    }

    function closeEditSetup(){
      el("editSetupModal").classList.add("hidden");
    }

    function editBackdropClose(event){
      if(event.target===el("editSetupModal")) closeEditSetup();
    }

    async function saveSetup(event){
      event.preventDefault();

      const btn=el("saveBtn");
      const id=el("eId").value;
      const code=el("eCode").value.trim();
      const designation=el("eDesignation").value.trim();
      const client=el("eClient").value.trim();
      const operation=el("eOperation").value.trim();
      const machine=el("eMachine").value.trim();
      const program=el("eProgram").value.trim();

      setEditMsg("");

      if(code && !/^\d{8}$/.test(code)){
        setEditMsg("O código interno da peça deve ter exatamente 8 dígitos.","error");
        return false;
      }

      if(!designation||!operation||!machine){
        setEditMsg("Designação, Operação e Máquina são obrigatórios.","error");
        return false;
      }

      btn.disabled=true;
      btn.textContent="A guardar...";
      setEditMsg("A gravar alterações no Supabase...");

      try{
        const payload={
          codigo_peca:code||null,
          designacao:designation,
          cliente:client||null,
          operacao:operation,
          maquina:machine,
          programa_cnc:program||null,
          updated_at:new Date().toISOString()
        };

        const {data,error}=await sb
          .from("setups")
          .update(payload)
          .eq("id",id)
          .select("id,codigo_peca,designacao,cliente,operacao,maquina,programa_cnc,estado,updated_at")
          .single();

        if(error) throw error;

        const i=setups.findIndex(x=>x.id===id);
        if(i>=0) setups[i]=data;

        renderSetups();
        setStatus("Setup atualizado com sucesso.");
        setEditMsg("Alterações guardadas.","ok");

        setTimeout(()=>closeEditSetup(),400);
      }catch(err){
        console.error("Erro ao guardar setup:",err);
        setEditMsg("Erro ao guardar: "+(err?.message||err),"error");
      }finally{
        btn.disabled=false;
        btn.textContent="Guardar alterações";
      }

      return false;
    }

    async function createSetup(event){
      event.preventDefault();
      const btn=el("createBtn");
      const code=el("mCode").value.trim(),designation=el("mDesignation").value.trim(),client=el("mClient").value.trim(),operation=el("mOperation").value.trim(),machine=el("mMachine").value.trim(),program=el("mProgram").value.trim();
      setCreateMsg("");
      if(code&&!/^\d{8}$/.test(code)){setCreateMsg("O código interno da peça deve ter exatamente 8 dígitos.","error");return false;}
      if(!designation||!operation||!machine){setCreateMsg("Designação, Operação e Máquina são obrigatórios.","error");return false;}
      btn.disabled=true;btn.textContent="A criar...";setCreateMsg("A gravar no Supabase...");
      try{
        const {data:sessionData,error:sessionError}=await sb.auth.getSession();
        if(sessionError) throw sessionError;
        if(!sessionData?.session) throw new Error("Sessão terminada. Entre novamente.");
        const payload={codigo_peca:code||null,designacao:designation,cliente:client||null,operacao:operation,maquina:machine,programa_cnc:program||null,estado:"Ativo"};
        const {data,error}=await sb.from("setups").insert([payload]).select("id,codigo_peca,designacao,cliente,operacao,maquina,programa_cnc,estado,updated_at").single();
        if(error) throw error;
        if(!data?.id) throw new Error("O Supabase não devolveu o ID do novo setup.");
        setups.unshift(data);renderSetups();setCreateMsg("Setup criado com sucesso.","ok");setStatus("Setup criado com sucesso no Supabase.");
        setTimeout(()=>{closeNewSetup();clearNewSetup();setCreateMsg("");openSetup(data.id);},350);
      }catch(err){console.error("Erro ao criar setup:",err);setCreateMsg("Erro ao criar setup: "+(err?.message||err),"error");}
      finally{btn.disabled=false;btn.textContent="Criar setup";}
      return false;
    }

    function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(!el("newSetupModal").classList.contains("hidden"))closeNewSetup();if(!el("editSetupModal").classList.contains("hidden"))closeEditSetup();}});
    window.login=login;window.logout=logout;window.openNewSetup=openNewSetup;window.closeNewSetup=closeNewSetup;window.backdropClose=backdropClose;window.createSetup=createSetup;window.renderSetups=renderSetups;window.openSetup=openSetup;window.closeEditSetup=closeEditSetup;window.editBackdropClose=editBackdropClose;window.saveSetup=saveSetup;window.showView=showView;window.renderPlanningParts=renderPlanningParts;window.syncNewPartFromCode=syncNewPartFromCode;window.syncEditPartFromCode=syncEditPartFromCode;
    boot();
  </script>
</body>
